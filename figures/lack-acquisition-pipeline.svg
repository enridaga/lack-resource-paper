<svg width="100%" viewBox="0 0 720 145" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>LACK knowledge acquisition pipeline</title>
  <desc>A horizontal flowchart showing the four stages of the LACK knowledge acquisition pipeline: source collection, relation extraction, quality filter, and entity linking, with the model or tool used at each stage and the artefact produced.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .stage-title { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; font-size: 13px; font-weight: 500; text-anchor: middle; }
    .stage-tool  { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; font-size: 10px; font-weight: 400; text-anchor: middle; }
    .artefact    { font-family: "Anthropic Sans", -apple-system, "system-ui", "Segoe UI", sans-serif; font-size: 10px; font-weight: 400; text-anchor: middle; font-style: italic; fill: rgb(95,94,90); }
    .arrow-line  { fill: none; stroke: rgb(115,114,108); stroke-width: 1.5px; }
  </style>

  <!-- STAGE 1: Source Collection -->
  <g>
    <rect x="10" y="40" width="160" height="60" rx="8" fill="rgb(241,239,232)" stroke="rgb(95,94,90)" stroke-width="0.5"/>
    <text x="90" y="63" class="stage-title" fill="rgb(68,68,65)">Source Collection</text>
    <text x="90" y="82" class="stage-tool" fill="rgb(95,94,90)">SPARQL Anything</text>
    <text x="90" y="96" class="stage-tool" fill="rgb(95,94,90)">DeSmog + LobbyMap</text>
    <text x="90" y="125" class="artefact">2,245 profile pages</text>
  </g>

  <line x1="172" y1="70" x2="195" y2="70" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- STAGE 2: Relation Extraction -->
  <g>
    <rect x="197" y="40" width="160" height="60" rx="8" fill="rgb(225,245,238)" stroke="rgb(15,110,86)" stroke-width="0.5"/>
    <text x="277" y="63" class="stage-title" fill="rgb(8,80,65)">Relation Extraction</text>
    <text x="277" y="82" class="stage-tool" fill="rgb(15,110,86)">Gemini 2.5 Flash</text>
    <text x="277" y="96" class="stage-tool" fill="rgb(15,110,86)">structured JSON prompt</text>
    <text x="277" y="125" class="artefact">90,145 relations (CSV)</text>
  </g>

  <line x1="359" y1="70" x2="382" y2="70" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- STAGE 3: Quality Filter -->
  <g>
    <rect x="384" y="40" width="160" height="60" rx="8" fill="rgb(250,238,218)" stroke="rgb(133,79,11)" stroke-width="0.5"/>
    <text x="464" y="63" class="stage-title" fill="rgb(99,56,6)">Quality Filter</text>
    <text x="464" y="82" class="stage-tool" fill="rgb(133,79,11)">Llama 3.3 70B (Groq)</text>
    <text x="464" y="96" class="stage-tool" fill="rgb(133,79,11)">drops generic non-entities</text>
    <text x="464" y="125" class="artefact">named-entity mentions</text>
  </g>

  <line x1="546" y1="70" x2="569" y2="70" class="arrow-line" marker-end="url(#arrow)"/>

  <!-- STAGE 4: Entity Linking -->
  <g>
    <rect x="571" y="40" width="140" height="60" rx="8" fill="rgb(238,237,254)" stroke="rgb(83,74,183)" stroke-width="0.5"/>
    <text x="641" y="63" class="stage-title" fill="rgb(60,52,137)">Entity Linking</text>
    <text x="641" y="82" class="stage-tool" fill="rgb(83,74,183)">Wikidata + LLM</text>
    <text x="641" y="96" class="stage-tool" fill="rgb(83,74,183)">+ SPARQL + web</text>
    <text x="641" y="125" class="artefact">enriched entities (CSV)</text>
  </g>
</svg>